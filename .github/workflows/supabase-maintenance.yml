name: Supabase maintenance

on:
  schedule:
    # GitHub schedules use UTC. This runs at 11:17 Bangladesh time every third day.
    - cron: '17 5 */3 * *'
  workflow_dispatch:

concurrency:
  group: supabase-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    name: Purge expired demo sandboxes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1; }

      - name: Remove expired demos
        run: |
          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/rest/v1/rpc/purge_demo_accounts"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bondhu | Your Partner in Growth</title>
    <meta
      name="description"
      content="Bondhu is a free wellness and growth companion for students and young professionals in Bangladesh: mood tracking, journaling, mentors, community and calming games."
    />
    <meta name="theme-color" content="#006a4e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bondhu" />
    <meta property="og:title" content="Bondhu | Your Partner in Growth" />
    <meta
      property="og:description"
      content="A free, private wellness and growth companion for students in Bangladesh, in English and Bangla."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bondhu logo with the tagline: mood, journal, mentors and calm games for students in Bangladesh."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Keep in sync with src/stores/useUiStore.ts (storage key + shape).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('bondhu-ui') || '{}');
          var theme = (saved.state && saved.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
